name: Bot PR Recovery

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Specific PR number to kick (optional)'
        required: false
        type: string

permissions:
  pull-requests: write
  issues: write

jobs:
  recover:
    uses: MervinPraison/github-automation-template/.github/workflows/bot-pr-recovery-callable.yml@v1.1.2
    secrets: inherit
    with:
      hub_ref: v1.1.2
      pr_number: ${{ github.event.inputs.pr_number || '' }}
