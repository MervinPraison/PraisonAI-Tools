name: Auto CI Failure → Claude

on:
  workflow_run:
    workflows: [CI, CI]
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: string
  schedule:
    - cron: '15 */6 * * *'

concurrency:
  group: ci-failure-scan-${{ github.repository }}-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  issues: write
  actions: read

jobs:
  detect-and-trigger:
    uses: MervinPraison/github-automation-template/.github/workflows/ci-failure-claude-callable.yml@v1.1.2
    secrets: inherit
    with:
      hub_ref: v1.1.2
      pr_number: ${{ github.event.inputs.pr_number || '' }}
