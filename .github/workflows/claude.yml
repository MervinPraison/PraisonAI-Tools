name: Claude Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned, labeled, opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    uses: MervinPraison/github-automation-template/.github/workflows/claude-assistant-callable.yml@v1.1.6
    secrets: inherit
    with:
      hub_ref: v1.1.6
