name: Auto Merge Conflict → Claude

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: merge-conflict-scan-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

permissions:
  pull-requests: write
  issues: write

jobs:
  detect-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MervinPraison/github-automation-template/.github/actions/hub-setup@v1.1.2
        with:
          hub_ref: v1.1.2
      - name: Detect conflicting PRs and trigger Claude
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.GH_TOKEN }}
          script: |
            const path = require('path');
            const mg = require(path.join(process.env.HUB_SCRIPTS, 'merge-gate.js'));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseRepo = `${owner}/${repo}`;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 50 });
            for (const pr of prs) {
              if (pr.draft) continue;
              if (pr.head?.repo?.full_name !== baseRepo) continue;
              const state = await mg.getMergeState(github, owner, repo, pr.number);
              if (state.status !== 'DIRTY') continue;
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number, per_page: 100 });
              if (mg.hasRecentConflictComment(comments)) continue;
              const body = '@claude this PR has merge conflicts with `main`. Rebase onto latest main, resolve conflicts, run tests, force-push with --force-with-lease.';
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['claude-conflict-pending'] });
            }
