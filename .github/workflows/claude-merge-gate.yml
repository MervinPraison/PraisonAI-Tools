name: Claude PR Merge Gate

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: string
      merge_method:
        required: false
        type: choice
        default: merge
        options: [merge, squash, rebase]
  workflow_run:
    workflows:
      - Claude Assistant
      - CI
    types: [completed]
  repository_dispatch:
    types: [claude-merge-gate]

concurrency:
  group: claude-merge-gate-${{ github.repository }}-${{ github.event.inputs.pr_number || github.event.client_payload.pr_number || github.event.workflow_run.id || 'scan' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  auto-dispatch:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: MervinPraison/github-automation-template/.github/actions/hub-setup@v1.1.1
        with:
          hub_ref: v1.1.1
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Dispatch merge gate when PR pipeline is ready
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const path = require('path');
            const mergeGate = require(path.join(process.env.HUB_SCRIPTS, 'merge-gate.js'));
            const wr = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (wr.conclusion !== 'success') return;
            const allowed = ['Claude Assistant', 'CI'];
            if (!allowed.includes(wr.name)) return;
            const prNumber = await mergeGate.resolvePrNumberFromWorkflowRun(github, owner, repo, wr);
            if (!prNumber) return;
            const fromClaude = wr.name === 'Claude Assistant';
            const check = await mergeGate.evaluatePipelineQuiescent(github, owner, repo, prNumber, core, {
              skipGlobalClaudeRunCheck: fromClaude,
              skipRecentClaudeCooldown: fromClaude,
            });
            if (!check.ready) return;
            await github.rest.repos.createDispatchEvent({
              owner, repo, event_type: 'claude-merge-gate',
              client_payload: { pr_number: prNumber },
            });

  merge-gate:
    if: github.event_name != 'workflow_run'
    uses: MervinPraison/github-automation-template/.github/workflows/claude-merge-gate-callable.yml@v1.1.1
    secrets: inherit
    with:
      hub_ref: v1.1.1
      pr_number: ${{ github.event.inputs.pr_number || github.event.client_payload.pr_number || '' }}
      merge_method: ${{ github.event.inputs.merge_method || 'merge' }}
