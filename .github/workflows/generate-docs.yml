name: Generate SDK Reference Docs

on:
  push:
    branches:
      - main
    paths:
      - 'praisonai_tools/**'
      - 'pyproject.toml'
      - 'scripts/generate_reference_docs.py'
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  repository_dispatch:
    types: [trigger-docs-generation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-docs-praisonaidocs
  cancel-in-progress: false

jobs:
  generate-docs:
    if: |
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push' &&
        !startsWith(github.event.workflow_run.head_commit.message, 'docs: auto-generate')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DOCS_PUSH_TOKEN: ${{ secrets.DOCS_GITHUB_TOKEN || secrets.GH_TOKEN }}
    steps:
      - name: Checkout PraisonAI Tools
        uses: actions/checkout@v4
        with:
          path: praisonai-tools

      - name: Checkout PraisonAI Source Repo
        uses: actions/checkout@v4
        with:
          repository: MervinPraison/PraisonAI
          path: praisonai-source

      - name: Checkout PraisonAI Docs
        uses: actions/checkout@v4
        with:
          repository: MervinPraison/PraisonAIDocs
          path: praisonai-docs
          token: ${{ env.DOCS_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PraisonAI Tools
        run: |
          cd praisonai-tools
          pip install -e .

      - name: Run Docs Generation
        run: |
          # Use the new unified CLI
          praisonai-tools docs-generate \
            --package all \
            --docs-root $(pwd)/praisonai-docs \
            --source-root $(pwd)/praisonai-source

      - name: Sync SDK reference navigation
        run: python3 praisonai-docs/scripts/sync_sdk_reference_nav.py
        env:
          PYTHONPATH: $(pwd)/praisonai-tools

      - name: Commit and Push Docs
        if: env.DOCS_PUSH_TOKEN != ''
        run: |
          cd praisonai-docs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: auto-generate SDK reference documentation"
            git pull --rebase origin main
            git push origin main
          fi
